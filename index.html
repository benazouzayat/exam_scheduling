<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBB Exam Scheduling Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans bg-gradient-to-br from-[rgba(9,80,34,0.3)] via-[rgba(9,80,34,0.3)] to-[rgba(234,239,245,0.5)] min-h-screen flex items-center justify-center p-2.5 md:p-4 leading-relaxed">
    <div class="w-full max-w-[600px]">
        <div class="bg-white rounded-2xl md:rounded-xl px-8 py-5 md:px-6 md:py-8 shadow-lg border border-slate-100 relative">
            <div class="text-center mb-4">
                <div class="flex justify-center mb-0">
                    <div class="flex justify-center">
                       <img src="assets/said.png" alt="Logo" class="h-[100px] w-auto">
                    </div>
                </div>
                <h1 class="text-slate-800 text-3xl md:text-2xl font-bold mb-0 tracking-tight">UMBB Exam Scheduling Platform</h1>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group mb-5 relative">
                    <label for="role" class="block text-[13px] font-semibold text-gray-700 mb-1.5">Role</label>
                    <select id="role" name="role" class="form-select w-full bg-white border-[1.5px] border-slate-200 rounded-lg py-[10.2px] px-3.5 text-gray-800 text-[15px] font-normal outline-none transition-all duration-200 focus:border-[#519D6C] focus:ring-[3px] focus:ring-[rgba(9,80,34,0.15)] appearance-none bg-[url('data:image/svg+xml,%3Csvg%20fill=%27none%27%20stroke=%27%236B7280%27%20stroke-width=%272%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20d=%27M6%209l6%206%206-6%27/%3E%3C/svg%3E')] bg-no-repeat bg-[right_14px_center] bg-[length:16px]">
                        <option value="" disabled selected>Select your role</option>
                        <option value="admin">Administrator (Service Examens)</option>
                        <option value="dean">Vice-Doyen / Doyen</option>
                        <option value="chef">Chef de Département</option>
                        <option value="student">Student</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>
                <div class="form-group mb-5 relative">
                    <label for="email" class="block text-[13px] font-semibold text-gray-700 mb-1.5">Matricule</label>
                    <input type="email" id="email" name="email" required autocomplete="email" class="w-full bg-white border-[1.5px] border-slate-200 rounded-lg py-[10.2px] px-3.5 text-slate-800 text-[15px] font-normal outline-none transition-all duration-200 font-sans placeholder:text-slate-400 focus:border-[#519D6C] focus:ring-[3px] focus:ring-[rgba(99,102,241,0.1)]">
                    <span class="error-message text-red-600 text-xs font-medium mt-1 opacity-0 -translate-y-0.5 transition-all duration-200 block" id="emailError"></span>
                </div>

                <div class="form-group mb-5 relative">
                    <label for="password" class="block text-[13px] font-semibold text-gray-700 mb-1.5">Password</label>
                    <div class="password-wrapper relative">
                        <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full bg-white border-[1.5px] border-slate-200 rounded-lg py-[10.2px] pr-11 px-3.5 text-slate-800 text-[15px] font-normal outline-none transition-all duration-200 font-sans placeholder:text-slate-400 focus:border-[#519D6C] focus:ring-[3px] focus:ring-[rgba(99,102,241,0.1)]">
                        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-slate-500 p-1.5 rounded transition-colors duration-200 flex items-center justify-center hover:text-indigo-500" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M9 3.75C5.25 3.75 2.04 6.24 1.5 9c.54 2.76 3.75 5.25 7.5 5.25s6.96-2.49 7.5-5.25c-.54-2.76-3.75-5.25-7.5-5.25zm0 8.75a3.5 3.5 0 110-7 3.5 3.5 0 010 7zm0-5.5a2 2 0 100 4 2 2 0 000-4z" fill="currentColor"/>
                            </svg>
                            <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M2.25 2.25l13.5 13.5m-4.125-4.125a3 3 0 01-4.243-4.243m4.243 4.243L9 9m2.625 2.625L15 15M9 5.25c1.83 0 3.51.63 4.84 1.68M3.16 6.93A10.97 10.97 0 019 5.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message text-red-600 text-xs font-medium mt-1 opacity-0 -translate-y-0.5 transition-all duration-200 block" id="passwordError"></span>
                </div>

                <div class="form-options flex justify-between items-center mb-6 gap-3">
                    <label class="checkbox-wrapper flex items-center cursor-pointer text-[13px] text-gray-700 font-medium whitespace-nowrap">
                        <input type="checkbox" id="remember" name="remember" class="hidden">
                        <span class="checkmark w-4 h-4 border-[1.5px] border-gray-300 rounded-sm mr-2 relative transition-all duration-200 bg-white"></span>
                        Remember this device
                    </label>
                    <a href="#" class="forgot-link text-[#095022] no-underline text-[13px] font-semibold transition-colors duration-200 hover:text-[#519D6C] whitespace-nowrap">Reset password</a>
                </div>

                <button type="submit" class="login-btn w-full bg-[#095022] text-white border-none rounded-lg py-3 px-5 cursor-pointer font-sans text-[15px] font-semibold relative mb-5 transition-all duration-200 overflow-hidden min-h-[44px] flex items-center justify-center hover:bg-[#519D6C] hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(99,102,241,0.4)] active:translate-y-0 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:translate-y-0 disabled:shadow-none">
                    <span class="btn-text transition-opacity duration-200">Sign In</span>
                    <div class="btn-loader absolute opacity-0 transition-opacity duration-200">
                        <div class="spinner w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    </div>
                </button>
            </form>

            <div class="success-message hidden text-center py-8 px-5 opacity-0 translate-y-4 transition-all duration-300" id="successMessage">
                <div class="success-icon mx-auto mb-4 animate-[successScale_0.5s_ease-out]">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="14" fill="#10B981"/>
                        <path d="M9 14l3 3 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3 class="text-slate-800 text-xl font-bold mb-1">Welcome back</h3>
                <p class="text-slate-500 text-sm font-medium">Taking you to your dashboard...</p>
            </div>
        </div>
    </div>

    <script src="../../shared/js/form-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
